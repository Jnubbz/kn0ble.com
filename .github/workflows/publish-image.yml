# Builds the site container and the WSPR viewer container and
# publishes both to GHCR. Does not publish GitHub Pages. Pages still deploys from the files on main.
name: Publish container image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Push to main, or a manual run from main. A dispatch from another
    # branch must not move the :latest tag Unraid pulls.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          image=ghcr.io/jnubbz/kn0ble-com
          sha="${GITHUB_SHA::7}"
          docker build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${image}:latest" \
            --tag "${image}:${sha}" \
            .
          docker push "${image}:latest"
          docker push "${image}:${sha}"

      # WSPR viewer: test it, then publish its own image. A failing
      # test stops here, so :latest only moves on a passing build.
      - name: Test WSPR viewer
        working-directory: services/wspr
        run: |
          python3 -m pip install -q -r requirements.txt pytest
          python3 -m pytest -q tests

      - name: Build and push WSPR viewer
        run: |
          image=ghcr.io/jnubbz/kn0ble-wspr
          sha="${GITHUB_SHA::7}"
          docker build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${image}:latest" \
            --tag "${image}:${sha}" \
            services/wspr
          docker push "${image}:latest"
          docker push "${image}:${sha}"
