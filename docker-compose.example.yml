# Unraid, Compose Manager plugin. This is the stack's compose.yaml in
# /boot/config/plugins/compose.manager/projects/kn0ble_com/.
# deploy-kn0ble.sh in that folder fetches it, pulls, and restarts.
#
# No host ports. The qsl-tracker stack's cloudflared container dials
# out to Cloudflare. On that tunnel, point both public hostnames at
# this container:
#   kn0ble.com     -> http://kn0ble-com:8080
#   www.kn0ble.com -> http://kn0ble-com:8080
#
# `qsl` is the network from the qsl-tracker compose file. Started from
# /mnt/cache/appdata/qsl-tracker, Docker names it qsl-tracker_qsl.
# This file joins that network. It does not start a second cloudflared.
#
# kn0ble-wspr is the WSPR spot viewer. kn0ble-com's nginx proxies
# /wspr/ to it by container name, so it needs no tunnel hostname.
# kn0ble-tv is the /tv stream relay; nginx proxies /tv/live/ to it.

services:
  kn0ble-com:
    image: ghcr.io/jnubbz/kn0ble-com:latest
    container_name: kn0ble-com
    restart: unless-stopped
    pull_policy: always
    networks:
      - qsl
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  kn0ble-wspr:
    image: ghcr.io/jnubbz/kn0ble-com:wspr
    container_name: kn0ble-wspr
    restart: unless-stopped
    # Optional: WSPR_CARTO_KEY=... in a .env file next to compose.yaml
    # switches the map to CARTO tiles. The deploy script never touches .env.
    env_file:
      - path: .env
        required: false
    pull_policy: always
    networks:
      - qsl
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/wspr/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Relay for /tv: ffmpeg pulls the channel that's on TV (set at
  # qsl.kn0ble.com/admin/tv) and serves browser-playable HLS. Runs
  # ffmpeg only while someone is watching. Needs TV_PROXY_TOKEN in .env,
  # the same value as in qsl-tracker's .env.
  # Optional in .env: TV_TRANSCODE=1 re-encodes video (for HEVC
  # sources browsers can't play; uses CPU).
  kn0ble-tv:
    image: ghcr.io/jnubbz/kn0ble-com:tv
    container_name: kn0ble-tv
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    pull_policy: always
    networks:
      - qsl
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  qsl:
    external: true
    name: qsl-tracker_qsl
