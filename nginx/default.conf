# Static files for kn0ble.com. One server, port 8080, so the
# unprivileged nginx user can bind it. GitHub Pages does not read
# this file.
# /space/ satellite page: upstream data (CelesTrak orbits, SatNOGS
# transmitters, Nominatim address lookups) is fetched through here and
# cached, so visitors never hit those sites directly and we stay well
# under CelesTrak's rate limits. Cache lives in /tmp (writable by the
# unprivileged user) and is rebuilt after a restart.
proxy_cache_path /tmp/space-cache levels=1:2 keys_zone=space:5m max_size=100m inactive=7d use_temp_path=off;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Redirects stay relative: behind cloudflared an absolute one would
    # carry this container's port 8080 to the visitor.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/css
        text/plain
        text/xml
        application/xml
        application/javascript
        application/json
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Conservative frame policy: this site is not embedded.
    add_header X-Frame-Options "SAMEORIGIN" always;

    # WSPR viewer: a separate container (kn0ble-wspr) on the qsl
    # network. Docker's DNS is resolved per request through a variable,
    # so nginx still starts (and `nginx -t` passes at build time) when
    # that container is down; /wspr/ then returns 502 until it is up.
    # ^~ keeps the static-asset regex below from catching /wspr/*.js.
    location = /wspr {
        return 301 /wspr/;
    }

    location ^~ /wspr/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $wspr_upstream kn0ble-wspr:8000;
        proxy_pass http://$wspr_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Song recordings for /oot live in the qsl-tracker container (Josh
    # uploads them at qsl.kn0ble.com/admin/oot). Same per-request DNS
    # trick as /wspr/, so this container still starts when qsl-tracker
    # is down. ^~ keeps the static-asset regex below from catching
    # /oot/audio/*.mp3 and looking for a local file.
    location ^~ /oot/audio/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $qsl_upstream qsl-tracker:8000;
        rewrite ^/oot/audio/(.*)$ /oot-audio/$1 break;
        proxy_pass http://$qsl_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # /tv plays whatever channel is "on TV" at qsl.kn0ble.com/admin/tv.
    # qsl-tracker serves it as /tv-config.json (no-store); same
    # per-request DNS trick as /wspr/ so this container starts without it.
    location = /tv/config.json {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $qsl_upstream qsl-tracker:8000;
        rewrite ^ /tv-config.json break;
        proxy_pass http://$qsl_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # /tv's video: the kn0ble-tv relay (ffmpeg) on the qsl network.
    # Same per-request DNS trick, so this container starts without it.
    location ^~ /tv/live/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $tv_upstream kn0ble-tv:8000;
        proxy_pass http://$tv_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        # The first playlist request waits while ffmpeg starts.
        proxy_read_timeout 40s;
    }

    # ---- /space/ satellite passes ----
    # Static page in /space/; these are its data proxies. Upstream names
    # go through variables + Docker's resolver so nginx still starts
    # when DNS or the internet is down (stale cache is served then).
    location = /space {
        return 301 /space/;
    }

    # Amateur-satellite TLEs, refreshed at most every 2 h.
    location = /space/api/tle/amateur {
        resolver 127.0.0.11 valid=300s ipv6=off;
        set $celestrak celestrak.org;
        proxy_pass https://$celestrak/NORAD/elements/gp.php?GROUP=amateur&FORMAT=tle;
        include /etc/nginx/conf.d/space-proxy.inc;
        proxy_set_header Host celestrak.org;
        proxy_ssl_name celestrak.org;
        proxy_cache_valid 200 2h;
        proxy_read_timeout 30s;
    }

    # One TLE by NORAD number (for curated sats outside the amateur group).
    location ~ "^/space/api/tle/cat/(?<catnr>[0-9]{1,6})$" {
        resolver 127.0.0.11 valid=300s ipv6=off;
        set $celestrak celestrak.org;
        proxy_pass https://$celestrak/NORAD/elements/gp.php?CATNR=$catnr&FORMAT=tle;
        include /etc/nginx/conf.d/space-proxy.inc;
        proxy_set_header Host celestrak.org;
        proxy_ssl_name celestrak.org;
        proxy_cache_valid 200 2h;
        proxy_read_timeout 30s;
    }

    # SatNOGS DB transmitter list (frequencies), refreshed every 12 h.
    location = /space/api/transmitters {
        resolver 127.0.0.11 valid=300s ipv6=off;
        set $satnogs db.satnogs.org;
        proxy_pass https://$satnogs/api/transmitters/?format=json;
        include /etc/nginx/conf.d/space-proxy.inc;
        proxy_set_header Host db.satnogs.org;
        proxy_ssl_name db.satnogs.org;
        proxy_cache_valid 200 12h;
        proxy_read_timeout 60s;
    }

    # Address -> lat/lon. Nominatim asks for an identifying User-Agent
    # and light use; results are cached for 30 days.
    location = /space/api/geocode {
        if ($arg_q = "") { return 400; }
        resolver 127.0.0.11 valid=300s ipv6=off;
        set $nominatim nominatim.openstreetmap.org;
        proxy_pass https://$nominatim/search?format=jsonv2&limit=5&q=$arg_q;
        include /etc/nginx/conf.d/space-proxy.inc;
        proxy_set_header Host nominatim.openstreetmap.org;
        proxy_ssl_name nominatim.openstreetmap.org;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1h;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Assets are not fingerprinted, so cache them for a day rather
    # than a year. `expires` sets Cache-Control without an add_header,
    # which would drop the security headers above.
    location ~* \.(?:css|js|mjs|svg|png|jpe?g|gif|webp|ico|woff2?)$ {
        expires 1d;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
