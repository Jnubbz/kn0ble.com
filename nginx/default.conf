# Static files for kn0ble.com. One server, port 8080, so the
# unprivileged nginx user can bind it. GitHub Pages does not read
# this file.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/css
        text/plain
        text/xml
        application/xml
        application/javascript
        application/json
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Conservative frame policy: this site is not embedded.
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Assets are not fingerprinted, so cache them for a day rather
    # than a year. `expires` sets Cache-Control without an add_header,
    # which would drop the security headers above.
    location ~* \.(?:css|js|mjs|svg|png|jpe?g|gif|webp|ico|woff2?)$ {
        expires 1d;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
