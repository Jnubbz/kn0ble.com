<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Songs</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    main.songs { max-width: 720px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    .songs h1 { font-size: 1.4rem; margin: 0 0 1rem; }
    .song-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0.75rem;
    }
    .song-btn {
      font: inherit;
      font-size: 1.05rem;
      padding: 1.1rem 0.9rem;
      border-radius: 10px;
      border: 1px solid var(--control-border);
      background: var(--card);
      color: var(--ink);
      cursor: pointer;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      min-height: 64px;
      -webkit-tap-highlight-color: transparent;
    }
    .song-btn:hover { border-color: var(--accent); }
    .song-btn:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
    .song-btn .state { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
    .song-btn.playing { background: var(--accent); border-color: var(--accent); color: #fff; }
    .song-btn.playing .state { color: #fff; }
    .song-btn.missing { opacity: 0.55; }
    .group-label { color: var(--muted); font-size: 0.9rem; margin: 1.5rem 0 0.5rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .stop-all { margin-top: 1.5rem; }
    .setup-link { margin-top: 2rem; font-size: 0.85rem; }
    .setup-link a { color: var(--muted); }
    .stop-all button {
      font: inherit; padding: 0.6rem 1.2rem; border-radius: 8px;
      border: 1px solid var(--control-border); background: transparent; color: var(--ink); cursor: pointer;
    }
  </style>
</head>
<body>
<main class="songs">
  <h1>Songs</h1>
  <div id="songs"></div>
  <div class="stop-all"><button type="button" id="stop">Stop</button></div>
  <p class="setup-link"><a href="https://qsl.kn0ble.com/admin/oot">Set up songs</a></p>
</main>

<script src="/oot/midi-player.js"></script>
<script>
  // Recordings are uploaded at qsl.kn0ble.com/admin/oot and served by
  // that app; this site's nginx proxies /oot/audio/ to it. The manifest
  // says which songs have a file (and gives a versioned file name).
  const FALLBACK = [
    ["zeldas-lullaby", "Zelda's Lullaby", "Songs"],
    ["eponas-song", "Epona's Song", "Songs"],
    ["sarias-song", "Saria's Song", "Songs"],
    ["suns-song", "Sun's Song", "Songs"],
    ["song-of-time", "Song of Time", "Songs"],
    ["song-of-storms", "Song of Storms", "Songs"],
    ["minuet-of-forest", "Minuet of Forest", "Warp songs"],
    ["bolero-of-fire", "Bolero of Fire", "Warp songs"],
    ["serenade-of-water", "Serenade of Water", "Warp songs"],
    ["nocturne-of-shadow", "Nocturne of Shadow", "Warp songs"],
    ["requiem-of-spirit", "Requiem of Spirit", "Warp songs"],
    ["prelude-of-light", "Prelude of Light", "Warp songs"],
  ].map(([slug, name, group]) => ({ slug, name, group, file: null }));

  const root = document.getElementById("songs");
  const player = new Audio();
  let current = null;
  let midi = null;          // handle from MidiPlayer.play(), when a .mid is playing
  let token = 0;            // ignores a slow .mid load after the user moved on

  function label(b) {
    return b.classList.contains("missing") ? "no file" : "";
  }

  function reset() {
    if (current) {
      current.classList.remove("playing");
      current.querySelector(".state").textContent = label(current);
    }
    current = null;
  }

  function stop() {
    token++;
    player.pause();
    player.currentTime = 0;
    if (midi) { midi.stop(); midi = null; }
    reset();
  }

  player.addEventListener("ended", reset);
  player.addEventListener("error", reset);

  function render(songs) {
    root.textContent = "";
    let grid = null, group = null;
    for (const s of songs) {
      if (s.group !== group) {
        group = s.group;
        const h = document.createElement("div");
        h.className = "group-label";
        h.textContent = group;
        root.appendChild(h);
        grid = document.createElement("div");
        grid.className = "song-grid";
        root.appendChild(grid);
      }
      const b = document.createElement("button");
      b.type = "button";
      b.className = "song-btn" + (s.file ? "" : " missing");
      b.innerHTML = '<span class="name"></span><span class="state"></span>';
      b.querySelector(".name").textContent = s.name;
      b.querySelector(".state").textContent = label(b);
      b.addEventListener("click", () => {
        if (!s.file) return;
        if (current === b) { stop(); return; }   // tap again to stop
        stop();
        current = b;
        b.classList.add("playing");
        b.querySelector(".state").textContent = "■ stop";
        const url = "/oot/audio/" + s.file;
        if (window.MidiPlayer && MidiPlayer.isMidi(s.file)) {
          MidiPlayer.unlock();   // must happen inside the tap on iPhone
          const mine = token;
          MidiPlayer.load(url).then(song => {
            if (mine !== token || current !== b) return;
            midi = MidiPlayer.play(song, () => { if (mine === token) { midi = null; reset(); } });
          }).catch(() => { if (mine === token) reset(); });
        } else {
          player.src = url;
          player.play().catch(() => {});
        }
      });
      grid.appendChild(b);
    }
  }

  fetch("/oot/audio/manifest.json", { cache: "no-store" })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(data => render(data.songs && data.songs.length ? data.songs : FALLBACK))
    .catch(() => render(FALLBACK));

  document.getElementById("stop").addEventListener("click", stop);
</script>
</body>
</html>
