<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>TV</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    main.tv { max-width: 1100px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
    .tv-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin: 0 0 0.75rem; }
    .tv h1 { font-size: 1.4rem; margin: 0; display: flex; align-items: center; gap: 0.6rem; }
    .live-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
    .live-dot.on { background: #e5484d; box-shadow: 0 0 0 0 rgba(229,72,77,0.6); animation: pulse 2s infinite; }
    @keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(229,72,77,0); } 100% { box-shadow: 0 0 0 0 rgba(229,72,77,0); } }
    @media (prefers-reduced-motion: reduce) { .live-dot.on { animation: none; } }
    .player {
      position: relative; aspect-ratio: 16 / 9; width: 100%;
      background: #000; border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
    }
    .player video { width: 100%; height: 100%; display: block; background: #000; }
    .overlay {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 0.75rem;
      padding: 1rem; text-align: center; background: rgba(0,0,0,0.55);
    }
    .overlay[hidden] { display: none; }
    .overlay p { margin: 0; max-width: 34rem; color: var(--ink); }
    .play-big {
      font: inherit; font-size: 1.1rem; padding: 0.8rem 1.6rem; border-radius: 999px;
      border: none; background: var(--accent); color: #fff; cursor: pointer;
    }
    .play-big:focus-visible, .controls button:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
    .controls { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; align-items: center; }
    .controls button {
      font: inherit; padding: 0.55rem 1.1rem; border-radius: 8px;
      border: 1px solid var(--control-border); background: transparent; color: var(--ink); cursor: pointer;
    }
    .controls button:hover { border-color: var(--accent); }
    .status { color: var(--muted); font-size: 0.9rem; margin-left: auto; }
    .setup-link { margin-top: 2rem; font-size: 0.85rem; }
    .setup-link a { color: var(--muted); }
    .spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.25); border-top-color: #fff; animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<main class="tv">
  <div class="tv-head">
    <h1><span class="live-dot" id="dot" aria-hidden="true"></span><span id="title">TV</span></h1>
  </div>

  <div class="player">
    <video id="video" controls playsinline preload="none"></video>
    <div class="overlay" id="overlay">
      <button type="button" class="play-big" id="start">&#9654; Watch</button>
    </div>
  </div>

  <div class="controls">
    <button type="button" id="golive">Jump to live</button>
    <button type="button" id="reload">Reload stream</button>
    <span class="status" id="status" role="status" aria-live="polite"></span>
  </div>
  <p class="setup-link"><a href="https://qsl.kn0ble.com/admin/tv">Set up TV</a></p>
</main>

<script src="/tv/hls.min.js"></script>
<script>
(function () {
  // The channel comes from qsl.kn0ble.com/admin/tv (proxied here as
  // /tv/config.json). Checked again every minute: switching channels
  // there changes what's playing here without a reload.
  var CONFIG_URL = "/tv/config.json";
  var POLL_MS = 60000;
  var url = "";
  var channelId = null;
  var loaded = false;
  var video = document.getElementById("video");
  var overlay = document.getElementById("overlay");
  var statusEl = document.getElementById("status");
  var dot = document.getElementById("dot");
  var hls = null;
  var retryTimer = null;
  var netRetries = 0;

  var titleEl = document.getElementById("title");
  function setTitle(name) { titleEl.textContent = name || "TV"; document.title = name || "TV"; }

  function status(msg) { statusEl.textContent = msg || ""; }

  function showOverlay(html, withButton) {
    overlay.hidden = false;
    overlay.innerHTML = "";
    if (html) { var p = document.createElement("p"); p.innerHTML = html; overlay.appendChild(p); }
    if (withButton) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "play-big"; b.textContent = withButton;
      b.addEventListener("click", function () { start(); });
      overlay.appendChild(b);
    }
  }
  function showSpinner() {
    overlay.hidden = false;
    overlay.innerHTML = '<div class="spinner" aria-hidden="true"></div>';
  }

  function configProblem() {
    if (!loaded) return "Can't load the channel setting right now. Try again in a minute.";
    if (!url) return "Nothing is on TV right now.";
    if (location.protocol === "https:" && /^http:\/\//i.test(url))
      return "The stream URL is <code>http://</code>, and browsers block that on an https page. It needs an https:// URL (or a proxy).";
    return null;
  }

  function teardown() {
    clearTimeout(retryTimer);
    if (hls) { hls.destroy(); hls = null; }
    video.removeAttribute("src");
    video.load();
  }

  function play() {
    var p = video.play();
    if (p && p.catch) p.catch(function () {
      // Autoplay with sound was blocked; ask for a tap.
      showOverlay("", "▶ Play");
    });
  }

  function start() {
    var problem = configProblem();
    if (problem) { showOverlay(problem); status(""); return; }
    teardown();
    netRetries = 0;
    showSpinner();
    status("Connecting…");

    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({ lowLatencyMode: true, backBufferLength: 30 });
      hls.on(Hls.Events.MANIFEST_PARSED, function () { play(); });
      hls.on(Hls.Events.FRAG_LOADED, function () { netRetries = 0; });
      hls.on(Hls.Events.ERROR, function (_e, data) {
        if (!data.fatal) return;
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
          // hls.js already retried the playlist itself; if it never
          // loaded, it's usually CORS, a dead URL, or the stream is down.
          if (data.details === Hls.ErrorDetails.MANIFEST_LOAD_ERROR ||
              data.details === Hls.ErrorDetails.MANIFEST_LOAD_TIMEOUT || netRetries >= 5) {
            fail("Can't reach the stream. It may be offline, or its server doesn't allow playback from other sites (CORS).");
            return;
          }
          netRetries++;
          status("Connection lost, retrying (" + netRetries + ")…");
          retryTimer = setTimeout(function () { if (hls) hls.startLoad(); }, 2000 * netRetries);
        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
          status("Recovering…");
          hls.recoverMediaError();
        } else {
          fail("The stream stopped (" + data.details + ").");
        }
      });
      hls.loadSource(url);
      hls.attachMedia(video);
    } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
      // Older iPhones: Safari plays HLS itself.
      video.src = url;
      video.addEventListener("loadedmetadata", play, { once: true });
      video.load();
    } else {
      fail("This browser can't play HLS streams.");
    }
  }

  function fail(msg) {
    teardown();
    dot.classList.remove("on");
    status("");
    showOverlay(msg, "Try again");
  }

  video.addEventListener("playing", function () { overlay.hidden = true; dot.classList.add("on"); status("Live"); });
  video.addEventListener("waiting", function () { status("Buffering…"); });
  video.addEventListener("pause", function () { dot.classList.remove("on"); status("Paused"); });
  video.addEventListener("error", function () {
    if (!hls) fail("Can't play the stream. It may be offline or blocked from playing here.");
  });

  document.getElementById("start").addEventListener("click", function () { start(); });
  document.getElementById("reload").addEventListener("click", function () { start(); });
  document.getElementById("golive").addEventListener("click", function () {
    if (hls && hls.liveSyncPosition != null) video.currentTime = hls.liveSyncPosition;
    else if (video.seekable.length) video.currentTime = video.seekable.end(video.seekable.length - 1) - 1;
    play();
  });

  function applyConfig(data, first) {
    var ch = data && data.channel;
    var newId = ch ? ch.id : null;
    var newUrl = ch ? String(ch.url || "") : "";
    var changed = newId !== channelId || newUrl !== url;
    loaded = true;
    channelId = newId; url = newUrl;
    setTitle(ch ? ch.name : "TV");
    if (first || !changed) {
      if (first) { var p = configProblem(); if (p) showOverlay(p); }
      return;
    }
    // Channel switched at /admin/tv. If something was playing, follow it.
    var wasWatching = !!hls || !!video.currentSrc;
    teardown();
    dot.classList.remove("on");
    var problem = configProblem();
    if (problem) { status(""); showOverlay(problem); return; }
    if (wasWatching) start(); else showOverlay("", "\u25B6 Watch");
  }

  function fetchConfig(first) {
    return fetch(CONFIG_URL, { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) { applyConfig(d, first); })
      .catch(function () { if (first) { loaded = false; showOverlay(configProblem(), "Try again"); } });
  }

  // "Watch" / "Try again" re-read the setting before playing.
  start = (function (play) {
    return function () {
      if (!loaded) { fetchConfig(true).then(function () { if (loaded && !configProblem()) play(); }); return; }
      play();
    };
  })(start);

  fetchConfig(true);
  setInterval(function () { if (!document.hidden) fetchConfig(false); }, POLL_MS);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) fetchConfig(false); });
})();
</script>
</body>
</html>
